name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di tab Actions GitHub

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Output (dompet-keluarga.apk)
        run: |
          mkdir -p build-output
          find app/build/outputs/apk -name "*.apk" -exec cp {} build-output/dompet-keluarga.apk \;
          echo "Daftar file di build-output:"
          ls -lh build-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dompet-Keluarga-APK
          path: build-output/dompet-keluarga.apk
